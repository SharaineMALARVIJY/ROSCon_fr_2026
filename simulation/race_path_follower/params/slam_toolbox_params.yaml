slam_toolbox:
  ros__parameters:
    use_sim_time: true
    mode: mapping

    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan

    max_laser_range: 12.0
    resolution: 0.05

    map_update_interval: 1.0

    use_scan_matching: false # slam_toolbox ne fonctionne pas si True 
    do_loop_closing: true
