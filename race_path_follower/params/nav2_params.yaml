# les packages de nav2 peuvent etre activer et desactiver dans le launch file

amcl:
  ros__parameters:
    random_seed: 0
    # Odometry noise
    alpha1: 0.1 # rotation -> rotation
    alpha2: 0.1 # rotation -> translation
    alpha3: 0.1 # translation -> translation
    alpha4: 0.1 # translation -> rotation
    # alpha5: 0.025

    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: "/scan"

    # Laser model
    laser_model_type: "likelihood_field" #"beam" et "likelihood_field_prob" a tester
    # max_beams: 60
    # laser_max_range: 100.0
    # laser_min_range: -1.0
    # laser_likelihood_max_dist: 2.0

    # Particles
    max_particles: 3000
    min_particles: 500

    # robot_model_type: "nav2_amcl::DifferentialMotionModel"

    set_initial_pose: false
    # initial_pose:
    #   x: 0.0
    #   y: 0.0
    #   z: 0.0
    #   yaw: 0.0

    # TF output
    # tf_broadcast: true
    # transform_tolerance: 1.0

    # Filter tuning
    update_min_d: 0.15
    update_min_a: 0.05  #0.05 rad = 2.9 degree
    # resample_interval: 1
    # recovery_alpha_fast: 0.0 # a tester
    # recovery_alpha_slow: 0.0 # a tester

    # pf_err: 0.05
    # pf_z: 0.99
    # sigma_hit: 0.2
    z_hit: 0.8
    z_rand: 0.2
    # z_max: 0.05
    # z_short: 0.05
    # lambda_short: 0.1
    # save_pose_rate: 0.5


bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    filter_duration: 0.3
    default_server_timeout: 60
    default_cancel_timeout: 50
    wait_for_service_timeout: 1000
    introspection_mode: "disabled"
    default_nav_through_poses_bt_xml: "$(find-pkg-share race_path_follower)/behavior_trees/navigate_through_poses.xml"
    default_nav_to_pose_bt_xml: "$(find-pkg-share race_path_follower)/behavior_trees/navigate_to_pose.xml"
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
      enable_groot_monitoring: false
      groot_server_port: 1667
      search_window: 2.0
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
      enable_groot_monitoring: false
      groot_server_port: 1669
      search_window: 2.0
    bt_search_directories:
      - $(find-pkg-share nav2_bt_navigator)/behavior_trees
    error_code_name_prefixes:
      - backup
      - compute_path
      - drive_on_heading
      - follow_path
      - nav_thru_poses
      - nav_to_pose
      - smoother
      - wait



controller_server:
  ros__parameters:
    odom_topic: /odom
    controller_frequency: 25.0 # changer aussi velocity_smoother frequency
    publish_zero_velocity: false
    search_window: 2.5
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    path_handler_plugins: ["PathHandler"]
    use_realtime_priority: false
    speed_limit_topic: "speed_limit"

    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.1 #m
      movement_time_allowance: 1.0 #s

    general_goal_checker:
      plugin: "nav2_controller::PositionGoalChecker"
      stateful: false
      xy_goal_tolerance: 1.0 #m
      path_length_tolerance: 0.1 #m

    PathHandler:
      plugin: "nav2_controller::FeasiblePathHandler"
      prune_distance: 2.0
      enforce_path_inversion: true
      enforce_path_rotation: false
      inversion_xy_tolerance: 0.2
      inversion_yaw_tolerance: 0.4
      minimum_rotation_angle: 0.785
      reject_unit_path: false

    # --- Regulated Pure Pursuit Controller ---
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      allow_obstacle_checking_beyond_goal: true

      # Vitesses limites
      desired_linear_vel: 1.6          # vitesse de croisière (m/s)

      use_dynamic_window : true
      max_linear_accel: 1.0            # accélération max (m/s²)
      max_linear_decel: -3.0            # décélération max (m/s²)

      # Lookahead
      use_velocity_scaled_lookahead_dist: true  # lookahead dynamique selon vitesse
      min_lookahead_dist: 0.1          # lookahead minimum (m)
      max_lookahead_dist: 1.5          # lookahead maximum (m)
      lookahead_time: 1.5              # temps lookahead adaptatif (s)

      # Rotation vers la cible (approach)
      use_rotate_to_heading: false           # DÉSACTIVÉ : Ackermann ne tourne pas sur place

      # Régulation de vitesse en courbe
      use_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 1.2   # rayon en dessous duquel on ralentit
      regulated_linear_scaling_min_speed: 0.25   # vitesse min en courbe serrée

      # Régulation par proximité des obstacles
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0

      # Limites angulaires Ackermann
      max_angular_accel: 99.0
      min_approach_linear_velocity: 0.05

      # Tolérance de suivi du chemin
      transform_tolerance: 0.1
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 0.5

      # Direction
      allow_reversing: true


    # FollowPath:
    #   plugin: "vector_pursuit_controller::VectorPursuitController"
    
    #   k: 5.0
    #   desired_linear_vel: 1.6
    #   min_linear_velocity: 0.2
    #   min_turning_radius: 0.89
    
    #   # Régulation de vitesse en courbe
    #   use_regulated_linear_velocity_scaling: false
    #   regulated_linear_scaling_min_radius: 2.0   # rayon en dessous duquel on ralentit
    #   regulated_linear_scaling_min_speed: 0.25   # vitesse min en courbe serrée
    
    
    #   max_lateral_accel: 2.5
    #   max_linear_accel: 2.5
    #   use_interpolation: true
    #   use_heading_from_path: true
    #   max_robot_pose_search_dist: 4.0
    #   approach_velocity_scaling_dist: 0.0 # ralentissement au goal desactivé
    #   transform_tolerance: 0.1
    
    #   # Lookahead
    #   use_velocity_scaled_lookahead_dist: true
    #   min_lookahead_dist: 0.1
    #   max_lookahead_dist: 1.5
    #   lookahead_time: 1.5
    
    #   # Obstacles / collision
    #   use_collision_detection: false
    #   max_allowed_time_to_collision_up_to_target: 1.0
    #   cost_scaling_dist: 0.3
    #   cost_scaling_gain: 1.0
    #   inflation_cost_scaling_factor: 3.0
    
