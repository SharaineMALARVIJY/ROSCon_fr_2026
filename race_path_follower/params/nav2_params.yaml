    #   use_rotate_to_heading: false
    #   allow_reversing: true



local_costmap:
  local_costmap:
    ros__parameters:
      publish_frequency: 8.0
      update_frequency: 12.0 # frequence du lidar
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      always_send_full_costmap: true
      introspection_mode: "disabled"
      # Footprint polygonal (40x20 cm)
      # Format : [[avant_gauche], [avant_droite], [arrière_droite], [arrière_gauche]]
      # footprint: "[[0.20, 0.10], [0.20, -0.10], [-0.20, -0.10], [-0.20, 0.10]]"
      footprint: "[[0.30, 0.10], [0.30, -0.10], [-0.08, -0.10], [-0.08, 0.10]]"
      plugins: ["obstacle_layer", "range_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.0
        inflation_radius: 0.25
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      range_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: false   # infrarouge désactiver car trop bruité
        topics: ["/range/ir_left", "/range/ir_right"]
        phi: 0.4
        clear_threshold: 0.1
        mark_threshold: 0.90
        clear_on_max_reading: true
        no_readings_timeout: 0.5


global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[0.30, 0.10], [0.30, -0.10], [-0.08, -0.10], [-0.08, 0.10]]"
      # footprint: "[[0.20, 0.10], [0.20, -0.10], [-0.20, -0.10], [-0.20, 0.10]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.40
      always_send_full_costmap: true
      introspection_mode: "disabled"



planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    expected_planner_frequency: 2.0 #10.0
    allow_partial_planning: true
    costmap_update_timeout: 1.0
    introspection_mode: "disabled"

    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"

      # Contrainte cinématique Ackermann
      minimum_turning_radius: 0.89        # rayon de braquage minimum (m)
      reverse_penalty: 2.0
      non_straight_penalty: 1.2

      # Heuristique
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      motion_model_for_search: "REEDS_SHEPP"  # ou "DUBIN" si marche arrière sinon REEDS_SHEPP

      # Coûts
      cost_travel_multiplier: 6.0
      angle_quantization_bins: 72

      # Tolérance sur l'objectif
      tolerance: 1.0
      allow_unknown: true
      lookup_table_size: 20.0
      debug_visualizations: false

      # Lissage intégré (post-processing du chemin Hybrid A*)
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.5
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2




smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["SmoothPath"]

    SmoothPath:
      plugin: "nav2_constrained_smoother/ConstrainedSmoother"

      reversing_enabled: true
      minimum_turning_radius: 0.89

      # Plus rapide
      max_iterations: 35
      w_cost: 0.015

      # Plus agressif
      w_smooth: 2000000.0
      w_curve: 50.0
      w_dist: 0.0

      # Autorise plus de déformation du chemin
      path_downsampling_factor: 2
      path_upsampling_factor: 1

      # Garde le départ et l'arrivée stables
      keep_start_orientation: true
      keep_goal_orientation: true



behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "drive_on_heading", "wait"]
    backup:
      plugin: "nav2_behaviors::BackUp"
      acceleration_limit: 2.5
      deceleration_limit: -2.5
      minimum_speed: 0.10
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
      acceleration_limit: 2.5
      deceleration_limit: -2.5
      minimum_speed: 0.10
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.0
    min_rotational_vel: 0.0
    rotational_acc_lim: 0.0


velocity_smoother:
  ros__parameters:
    smoothing_frequency: 25.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [3.0, 0.0, 99.0]
    min_velocity: [-1.5, 0.0, -99.0]
    max_accel: [1.0, 0.0, 99.0]
    max_decel: [-3.0, 0.0, -99.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0


collision_monitor:
  ros__parameters:
    enabled: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_twist"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      time_before_collision: 0.5
      simulation_time_step: 0.05
      min_points: 6
      visualize: false
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: /scan
      enabled: true

map_server:
  ros__parameters:
    introspection_mode: "disabled"

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
    introspection_mode: "disabled"
