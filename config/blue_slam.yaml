slam_toolbox:
  ros__parameters:
    use_sim_time: false
    mode: mapping

    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /blue_car/scan

    max_laser_range: 12.0
    resolution: 0.05

    map_update_interval: 1.0
    minimum_time_interval: 0.05
    minimum_travel_distance: 0.02
    minimum_travel_heading: 0.02

    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    throttle_scans: 1

    use_scan_matching: false #jsp pourquoi ca marche pas
    do_loop_closing: true
